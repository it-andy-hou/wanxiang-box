# ============================================================
# 万象匣 - macOS 自动打包工作流
# 触发方式：
#   1. 推送 v* 开头的 tag（如 git tag v1.0.0 && git push --tags）
#   2. 在 GitHub 网页 Actions 页面手动点击 "Run workflow"
# 产物：x64 (Intel) + arm64 (Apple Silicon) 两个 dmg
# ============================================================
name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 必须显式授权写权限，否则 electron-builder 创建 GitHub Release 时会报 403
permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装依赖
        run: npm install

      - name: 移除可选原生依赖 cpu-features
        run: rm -rf node_modules/cpu-features

      - name: 打包 macOS (dmg, x64 + arm64)
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: wanxiang-box-mac
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30
